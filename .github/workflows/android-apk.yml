name: Build Android APK

# Builds an installable APK in Expo's cloud (EAS) and prints a download link.
#
# SETUP (one time):
#   1. Create a free Expo account: https://expo.dev
#   2. Create an access token: https://expo.dev/accounts/[you]/settings/access-tokens
#   3. In GitHub: Settings → Secrets and variables → Actions → New repository secret
#        Name:  EXPO_TOKEN
#        Value: <the token>
#
# Then trigger it from the Actions tab ("Run workflow"), or let it run on every
# push to the feature branch (note: each run consumes EAS build credits — the
# free tier is limited, so you may prefer manual runs only; see `push:` below).

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/phone-app-full-cycle-sxc8iz
    # To stop building on every push and only build manually, delete the whole
    # `push:` block above.

jobs:
  build-apk:
    name: EAS preview APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check EXPO_TOKEN is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. See the comment at the top of this workflow for setup steps."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK (preview profile)
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Where to download
        if: always()
        run: echo "When the build finishes, the APK download link is in the log above and at https://expo.dev → your project → Builds."
